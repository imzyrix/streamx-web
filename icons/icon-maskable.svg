<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Full-bleed maskable icon: no rounding, safe zone keeps the mark centered -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16161b"/>
      <stop offset="1" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="x" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#ff3b47"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(0.62) translate(-256 -256)">
    <rect x="98" y="206" width="316" height="100" rx="50" fill="url(#x)" transform="rotate(45 256 256)"/>
    <rect x="98" y="206" width="316" height="100" rx="50" fill="url(#x)" transform="rotate(-45 256 256)"/>
  </g>
</svg>