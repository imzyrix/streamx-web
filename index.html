<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />
    <title>StreamX — Movies &amp; Series</title>
    <meta
      name="description"
      content="StreamX — browse trending movies and series with IMDb, Rotten Tomatoes and Metacritic scores, cast, facts and where to watch. Powered by a keyless metadata API."
    />
    <link rel="preconnect" href="https://api.streamx.qzz.io" crossorigin />
    <link rel="preconnect" href="https://images.metahub.space" crossorigin />
    <link rel="dns-prefetch" href="https://streamx-api.pages.dev" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StreamX" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="mask-icon" href="/icon.svg" color="#ffffff" />

    <!-- Three.js is served as a pre-built asset rather than bundled into the app. -->
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 4rem 2rem; font-family: system-ui; color: #f5f5f5; background: #050505">
        StreamX needs JavaScript to load catalogue data.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
